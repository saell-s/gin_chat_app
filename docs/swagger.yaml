basePath: /
definitions:
  auth.LoginInput:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 72
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshInput:
    properties:
      refresh_token:
        maxLength: 256
        minLength: 10
        type: string
    required:
    - refresh_token
    type: object
  user.AdminUpdateInput:
    properties:
      name:
        maxLength: 120
        minLength: 1
        type: string
      role:
        enum:
        - admin
        - editor
        - user
        type: string
      status:
        enum:
        - active
        - suspended
        type: string
    type: object
  user.ChangePasswordInput:
    properties:
      current_password:
        maxLength: 72
        minLength: 8
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  user.RegisterInput:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.UpdateProfileInput:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API built with Gin, PostgreSQL and JWT
  title: Gin REST API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges email and password for a token pair.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the presented refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: Returns the account tied to the presented access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Current identity
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token and returns a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new account and returns its first token pair.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register
      tags:
      - auth
  /api/v1/dashboard/activity:
    get:
      consumes:
      - application/json
      description: Returns the latest recorded domain events.
      parameters:
      - description: Number of events (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Recent activity
      tags:
      - dashboard
  /api/v1/dashboard/summary:
    get:
      consumes:
      - application/json
      description: Returns aggregated user, order and product statistics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard summary
      tags:
      - dashboard
  /api/v1/reports/generate:
    post:
      consumes:
      - application/json
      description: Builds a sales report and records a report.generated event.
      parameters:
      - description: Range start (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Range end (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: day|week|month (default day)
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate a report
      tags:
      - reporting
  /api/v1/reports/sales:
    get:
      consumes:
      - application/json
      description: Aggregated sales time series grouped by day, week or month.
      parameters:
      - description: Range start (RFC3339 or YYYY-MM-DD, default -30 days)
        in: query
        name: from
        type: string
      - description: Range end (RFC3339 or YYYY-MM-DD, default now)
        in: query
        name: to
        type: string
      - description: day|week|month (default day)
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Sales report
      tags:
      - reporting
  /api/v1/reports/sales.csv:
    get:
      consumes:
      - application/json
      description: Streams the raw orders of the requested range as a CSV file.
      parameters:
      - description: Range start (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Range end (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: text/csv
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Export orders as CSV
      tags:
      - reporting
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of users, filterable by role, status and
        free text.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter by role (admin|editor|user)
        in: query
        name: role
        type: string
      - description: Filter by status (active|suspended)
        in: query
        name: status
        type: string
      - description: Search in email or name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: 'Admin only: removes a user and revokes their sessions.'
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Returns a single user by id. Admins may read anyone, others only
        themselves.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: 'Admin only: updates name, role and status of any user.'
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - description: User patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AdminUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
  /api/v1/users/me:
    get:
      consumes:
      - application/json
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates the name and/or email of the authenticated user.
      parameters:
      - description: Profile patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
  /api/v1/users/me/password:
    patch:
      consumes:
      - application/json
      description: Rotates the password of the authenticated user.
      parameters:
      - description: Password change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
